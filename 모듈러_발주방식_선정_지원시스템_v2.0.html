<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>모듈러 발주방식 선정 지원시스템</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 배치 개념(디자인 시안 v2 '관제실 룩'): 짙은 남색 명령 바 · 흰 상태 줄 · 왼쪽 단계 레일 · 가운데 작업면 · 오른쪽 사업 요약. 9개 발주방식은 상단 띠 색으로 상태를 보이는 3×3 타일 보드. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F7F8FA; --sunken:#E8ECF2; --line:#D5DBE5; --line-strong:#AEB8C8;
  --ink:#0E1726; --ink-2:#404B61; --ink-3:#66728A;
  --accent:#1E4FBF; --accent-strong:#163C94; --accent-soft:#E4ECFB; --accent-ink:#FFFFFF;
  --ok:#157A3B; --ok-soft:#DEF3E5; --warn:#9A6400; --warn-soft:#FFF0CC; --warn-mark:#D9960A; --warn-hatch:#F4D27A; --no:#B42318; --no-soft:#FCE4E1; --unk:#4C5B78; --unk-soft:#E6EAF2;
  --pos:#2F6FE0; --neg:#D9483F; --mid:#DDE2EA; --steel:#93A3BD;
  --bar:#0F1B2D; --bar-2:#1A2A42; --bar-line:#2E4160; --bar-ink:#E9EEF6; --bar-ink-2:#C7D2E3; --bar-ink-3:#93A3BD;
  --shadow:0 1px 2px rgba(14,23,38,.05),0 10px 28px -16px rgba(14,23,38,.18); --lift:0 10px 22px -12px rgba(30,79,191,.55);
  --font-display:"Hahmlet","Noto Serif KR","Nanum Myeongjo","Noto Serif CJK KR",serif;
  --font-body:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C121C; --surface:#151D2A; --surface-2:#1A2433; --sunken:#101722; --line:#283446; --line-strong:#3E4C64;
  --ink:#EDF1F7; --ink-2:#B9C3D4; --ink-3:#8E9AB0;
  --accent:#6FA3F2; --accent-strong:#9DBFF5; --accent-soft:#1B2E4E; --accent-ink:#0B1524;
  --ok:#5BCB7B; --ok-soft:#16321F; --warn:#F0B93F; --warn-soft:#3A2D10; --warn-mark:#F0B93F; --warn-hatch:#5A4616; --no:#F1847E; --no-soft:#3B1A18; --unk:#AFBBD0; --unk-soft:#243044;
  --pos:#4A8BEA; --neg:#E66767; --mid:#333D4D; --steel:#5E6C84;
  --bar:#0A1220; --bar-2:#152238; --bar-line:#2A3A55; --bar-ink:#EDF1F7; --bar-ink-2:#C7D2E3; --bar-ink-3:#8E9AB0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7); --lift:0 10px 22px -12px rgba(111,163,242,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0C121C; --surface:#151D2A; --surface-2:#1A2433; --sunken:#101722; --line:#283446; --line-strong:#3E4C64;
  --ink:#EDF1F7; --ink-2:#B9C3D4; --ink-3:#8E9AB0;
  --accent:#6FA3F2; --accent-strong:#9DBFF5; --accent-soft:#1B2E4E; --accent-ink:#0B1524;
  --ok:#5BCB7B; --ok-soft:#16321F; --warn:#F0B93F; --warn-soft:#3A2D10; --warn-mark:#F0B93F; --warn-hatch:#5A4616; --no:#F1847E; --no-soft:#3B1A18; --unk:#AFBBD0; --unk-soft:#243044;
  --pos:#4A8BEA; --neg:#E66767; --mid:#333D4D; --steel:#5E6C84;
  --bar:#0A1220; --bar-2:#152238; --bar-line:#2A3A55; --bar-ink:#EDF1F7; --bar-ink-2:#C7D2E3; --bar-ink-3:#8E9AB0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7); --lift:0 10px 22px -12px rgba(111,163,242,.5); color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0} ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* ── 명령 바 ── */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:12px 28px;min-height:64px;background:var(--bar);color:var(--bar-ink)}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--font-display);font-weight:600;font-size:19px;letter-spacing:-.01em;line-height:1.25}
.brand span{display:block;font-size:11.5px;color:var(--bar-ink-3);letter-spacing:.04em}
.top-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 14px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--accent-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--sunken);color:var(--ink)}
.btn.lg{min-height:44px;padding:0 20px;font-size:14.5px;border-radius:10px;font-weight:600}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{flex:none}
.top .btn{border-color:var(--bar-line);background:transparent;color:var(--bar-ink);font-size:13px}
.top .btn:hover{border-color:var(--bar-ink-3);color:#fff}
.top .btn.quiet{border-color:transparent;color:var(--bar-ink-2)} .top .btn.quiet:hover{background:var(--bar-2);color:var(--bar-ink)}
.top .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600} .top .btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.top .seg{border:0;background:var(--bar-2);border-radius:999px;padding:4px;gap:4px}
.top .seg span{border-radius:999px;padding:6px 14px;color:var(--bar-ink-2);font-weight:500;min-height:32px;display:flex;align-items:center}
.top .seg label:hover span{color:#fff}
.top .seg input:checked + span{background:#FFFFFF;color:#0F1B2D;font-weight:600;box-shadow:none}
.top .seg input:focus-visible + span{outline:2px solid #fff;outline-offset:1px}

/* ── 상태 줄 ── */
.statusline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:9px 28px;background:var(--surface);border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.statusline .sdot{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
.statusline .sdot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.statusline .sdot.ex::before{background:var(--warn-mark)} .statusline .sdot.hypo::before{background:var(--unk)}
.statusline .dim{color:var(--ink-3)} .statusline .right{margin-left:auto;color:var(--ink-3)}
.linkbtn{border:0;background:none;padding:0;font-size:12.5px;font-weight:600;color:var(--accent-strong);text-decoration:underline;text-underline-offset:3px}
.banner{max-width:1344px;margin:12px auto 0;padding:9px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);font-size:13.5px}
.banner-wrap{padding-inline:28px}
.banner b{color:var(--warn)}
.banner.hypo{border-color:var(--accent);background:var(--accent-soft)} .banner.hypo b{color:var(--accent-strong)}

/* ── 골격 ── */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr) 292px;gap:24px;max-width:1400px;margin:0 auto;padding:24px 28px 8px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;flex-direction:column;gap:0}
.step{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr);gap:0 12px;align-items:start;text-align:left;padding:10px 10px 10px 8px;border:1px solid transparent;border-radius:10px;background:transparent}
.step:hover{background:var(--sunken)}
.step + .step{margin-top:14px}
.step + .step::before{content:"";position:absolute;left:21px;top:-14px;width:2px;height:14px;background:var(--line)}
.step i{grid-row:span 2;display:grid;place-items:center;width:28px;height:28px;border:1.5px solid var(--line-strong);border-radius:50%;font-style:normal;font-weight:600;font-size:13px;color:var(--ink-3);background:var(--surface)}
.step b{font-weight:600;font-size:14.5px;line-height:1.35;align-self:end;color:var(--ink-2)}
.step small{font-size:12px;color:var(--ink-3);line-height:1.4}
.step[aria-current="step"]{background:var(--surface);border-color:var(--line);box-shadow:0 1px 2px rgba(14,23,38,.06)}
.step[aria-current="step"] i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.step[aria-current="step"] b{font-weight:700;color:var(--ink)}
.step.done i{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-strong)} .step.done b{color:var(--ink)}
.rail-foot{margin-top:22px;padding:14px 12px 0;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);line-height:1.6}
.site-foot{max-width:1400px;margin:12px auto 0;padding:18px 28px 26px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px;font-size:12px;line-height:1.6;color:var(--ink-3)}
.site-foot p{max-width:900px} .site-foot .copy{font-weight:500}

.main{min-width:0}
.main-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 24px;margin-bottom:20px}
.main-head h1{font-family:var(--font-display);font-weight:600;font-size:30px;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
.main-head p{flex:1 1 320px;color:var(--ink-2);max-width:62ch;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.panel + .panel,.panel + .catsec,.catsec + .panel,.catsec + .catsec,.callouts + .panel{margin-top:16px}
.panel h2{font-size:16px;font-weight:700;line-height:1.4}
.panel h2 + .hint{margin-top:2px}
.hint{font-size:13px;color:var(--ink-3)}
.sect{margin-top:26px} .sect:first-child{margin-top:0}
.sect > h2{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:12px}
.rule{height:1px;background:var(--line);border:0;margin:22px 0}
.foot-nav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:20px}

/* ── 입력 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px 20px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field > label,.field > .lab{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .sub{font-size:12.5px;color:var(--ink-3)}
.inp,select.inp,textarea.inp{width:100%;min-height:40px;padding:7px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface)}
textarea.inp{min-height:64px;resize:vertical;line-height:1.5}
.inp:hover{border-color:var(--ink-3)} .inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.inp.sm{min-height:34px;padding:4px 10px;font-size:13px;border-radius:8px}
.unit-inp{display:flex;align-items:center;gap:8px} .unit-inp .inp{max-width:150px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.checks{display:flex;flex-wrap:wrap;gap:6px 8px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:5px 12px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-size:13px;cursor:pointer}
.pill input{accent-color:var(--accent);margin:0}
.pill:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong);font-weight:500}
.field > .seg{align-self:flex-start}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-2);padding:3px;gap:3px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;padding:5px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.seg label:hover span{color:var(--ink)}
.seg input:checked + span{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(14,23,38,.12)}
.seg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:1px}
.seg.lvl{display:grid;grid-template-columns:repeat(4,1fr);width:100%;gap:4px;border:0;background:var(--sunken);border-radius:10px;padding:4px}
.seg.lvl span{display:grid;place-items:center;text-align:center;min-height:36px;padding:4px;white-space:normal;line-height:1.3;border-radius:7px}
.seg.lvl input:checked + span{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(14,23,38,.12)}
.seg.lvl input[value="high"]:checked + span{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.seg.lvl input[value="unknown"]:checked + span{color:var(--ink-2)}
.frow.rec .seg.lvl{background:var(--surface-2);box-shadow:0 0 0 1px var(--line) inset;border:0}
.frow.rec .seg.lvl input[value="high"]:checked + span{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(14,23,38,.12)}
.tierchip{display:inline-flex;align-items:center;gap:8px;padding:4px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);font-weight:600;font-size:13px}
.tierchip.none{background:var(--warn-soft);color:var(--warn)}

/* ── 상태 표시 ── */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1.5}
.chip svg{flex:none}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.cond{background:var(--warn-soft);color:var(--warn)} .chip.unknown{background:var(--unk-soft);color:var(--unk)} .chip.no{background:var(--no-soft);color:var(--no)}
.chip.plain{background:var(--sunken);color:var(--ink-2)} .chip.acc{background:var(--accent-soft);color:var(--accent-strong)}
.tag{display:inline-block;padding:0 7px;border-radius:999px;background:var(--sunken);font-size:11.5px;font-weight:600;color:var(--ink-3);line-height:1.7;white-space:nowrap}
.tag.caution{background:var(--warn-soft);color:var(--warn)} .tag.user{background:var(--accent-soft);color:var(--accent-strong)}

/* ── 타일 보드: 9개 발주방식, 상단 띠 색이 상태 ── */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.unit{position:relative;display:flex;flex-direction:column;gap:3px;min-width:0;min-height:104px;padding:9px 12px 10px;border:1px solid var(--line);border-top:4px solid var(--steel);border-radius:10px;text-align:left;background:var(--surface);overflow:hidden}
.unit .hd{display:flex;align-items:center;gap:6px;min-width:0} .unit .hd .sc{margin-left:auto;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.unit .code{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.04em}
.unit .name{font-weight:600;font-size:14px;line-height:1.3}
.unit .st{display:flex;flex-wrap:wrap;align-items:center;gap:2px 5px;font-size:11.5px;font-weight:600;margin-top:auto;padding-top:6px;line-height:1.35}
.unit .st svg{display:none}
.unit[data-s="ok"]{border-top-color:var(--ok)} .unit[data-s="ok"] .st{color:var(--ok)}
.unit[data-s="cond"]{border-top-color:var(--warn-mark)} .unit[data-s="cond"] .st{color:var(--warn)}
.unit[data-s="unknown"]{border-top-color:var(--unk)} .unit[data-s="unknown"] .st{color:var(--unk)}
.unit[data-s="no"]{border-top-color:var(--no);background:var(--surface-2)} .unit[data-s="no"] .name,.unit[data-s="no"] .code,.unit[data-s="no"] .hd .sc{color:var(--ink-3)} .unit[data-s="no"] .st{color:var(--no)}
.unit.is-top{border:2px solid var(--accent);border-top-width:4px;box-shadow:var(--lift);transform:translateY(-4px)}
.unit.is-top .name{font-weight:700} .unit.is-top .hd .sc{font-weight:700;color:var(--ink)}
.unit .top-badge{display:inline-block;vertical-align:2px;margin-right:5px;font-size:10.5px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:0 7px;line-height:1.6;white-space:nowrap} .unit .hd .code{white-space:nowrap}
.board.mini{gap:6px} .board.mini .unit{min-height:0;padding:7px 9px 7px;gap:1px;border-top-width:3px} .board.mini .name{font-size:12px;font-weight:500} .board.mini .st{font-size:11px;padding-top:3px} .board.mini .top-badge{display:none} .board.mini .unit.is-top{transform:none;box-shadow:none}
button.unit{cursor:pointer;font:inherit;color:inherit} button.unit:hover{border-color:var(--accent)}
.stripes{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:12px}
.stripes span{display:inline-flex;align-items:center;gap:6px} .stripes i{width:14px;height:4px;border-radius:2px;display:inline-block}
.stripes .ok{background:var(--ok)} .stripes .cond{background:var(--warn-mark)} .stripes .unknown{background:var(--unk)} .stripes .no{background:var(--no)}

/* ── 적용 가능성 목록 ── */
.pmrow{display:grid;grid-template-columns:170px minmax(0,1fr);gap:6px 18px;padding:14px 0;border-top:1px solid var(--line)}
.pmrow:first-child{border-top:0;padding-top:4px}
.pmrow h3{font-size:14.5px;font-weight:600;line-height:1.35} .pmrow .code{font-size:12px;color:var(--ink-3);font-weight:600}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.5}
.item svg{margin-top:3px} .item.ok svg{color:var(--ok)} .item.cond svg{color:var(--warn-mark)} .item.unknown svg{color:var(--unk)} .item.no svg{color:var(--no)} .item.info svg{color:var(--ink-3)}
.item .law a{color:inherit;text-decoration:underline;text-underline-offset:2px} .item .law a:hover{color:var(--accent-strong)}
.law a{color:inherit}
.help{display:inline-flex;align-items:center;gap:4px;padding:1px 8px 1px 6px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-size:12px;font-weight:500;color:var(--accent-strong);vertical-align:middle;line-height:1.6} .help:hover{border-color:var(--accent)}
.tag.acc-tag{background:var(--accent-soft);color:var(--accent-strong)}
.trades td{vertical-align:middle} .trades th:not(:last-child),.trades td:not(:last-child){white-space:nowrap;width:1%} .trades .seg{flex-wrap:nowrap} .trades .seg.sm span{padding:3px 8px;font-size:12.5px} .trades .inp.sm{min-width:120px;width:100%} .trades td:first-child b{white-space:nowrap}
.pre{background:var(--accent-soft);border-color:transparent} .pre .meta dt{color:var(--ink-2)}
.seg.sm span{padding:3px 10px;font-size:12.5px}
.item .law{display:block;font-size:12px;color:var(--ink-3)}
details.more{margin-top:8px} details.more > summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent-strong);width:fit-content}
details.more[open] > summary{margin-bottom:8px}
.ovr{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ovr .inp{flex:1 1 220px;width:auto}
.notes li{position:relative;padding-left:14px;font-size:13.5px;color:var(--ink-2);margin-top:6px}

    docs: '실시설계 도서, 대안 허용범위·평가기준', laws: ['nc79', 'nc84', 'lc95'] },
  separation: { title: '분리발주 의무는 어떻게 적용됩니까?', intro: '전기공사, 정보통신공사, 소방시설공사는 다른 공사와 분리해 발주하는 것이 원칙입니다. 예외 사유는 법령별로 다르며, 일괄·대안·기술제안입찰은 전기·소방공사의 예외 사유이지만 정보통신공사에는 그러한 예외가 없습니다.',
    cond: ['사업에 세 공종이 포함되는지 확인합니다.', '통합발주를 계획하면 각 법령의 예외 사유에 해당하는지 공종별로 확인합니다.', '현행법에는 모듈러 건축 고유의 분리발주 예외가 없습니다(2026-10-24 확인, 정보통신공사업법 시행령 2026.10.22. 시행본 포함). 특별법안의 특례는 국회 계류 중입니다.'],
    docs: '공종별 공사범위, 예외 사유 검토서', laws: ['elec', 'ict', 'fire', 'bill'] },
  materials: { title: '공사용자재 직접구매란 무엇입니까?', intro: '공공기관이 공사를 발주할 때 중소기업자간 경쟁제품으로 지정된 자재는 공사와 분리해 직접 구매(관급)해야 하는 제도입니다. 모듈러 유닛이나 구성 부품이 대상 품목에 해당하면 계약 구성과 제작 일정에 영향을 줍니다.',
    cond: ['사업에 들어가는 자재 가운데 직접구매 대상 품목이 있는지 확인합니다.', '대상이면 관급 공급 일정과 모듈 공장 제작 일정의 정합성을 검토합니다.', '예외 사유(긴급, 기술적 일체성 등)에 해당하는지 확인합니다.'],
    docs: '자재 목록, 직접구매 대상 품목 고시, 예외 검토서', laws: ['mat'] },
  review: { title: '입찰방법 심의는 무엇을 확인합니까?', intro: '일괄입찰·대안입찰·기술제안입찰은 건설기술심의위원회(국가: 중앙, 지방: 지방)의 입찰방법 심의를 거쳐 입찰방법을 정합니다. 심의 결과는 특정 사업·금액·범위에 대한 것이므로, 이번 검토와 같은 사업인지 확인해야 합니다.',
    cond: ['심의에서 결정된 입찰방법이 검토 중인 방식과 같은지 확인합니다.', '심의 대상 사업·추정가격·공사범위가 이번 검토와 동일한지 확인합니다.', '심의 결과에 따라 입찰방법을 공고합니다.'],
    docs: '심의 신청서, 심의 결과 통보서, 공고문', laws: ['nc79', 'lc95'] }
};

/* 적용성 규칙표(초안). 반환: {PMx:{status, auto, items:[{k,t,law,act}], user}} */
function evalEligibility(st) {
  const p = st.project, e = st.elig, hypo = p.regime === 'hypo';
  const ag = AGENCY[p.agency] || AGENCY.national, K = ag.k;
  const costNum = (p.cost == null || p.cost === '' || isNaN(+p.cost)) ? null : +p.cost;
  const priced = costNum != null && p.costBasis === 'estimate';
  const totalNum = p.sameTotal ? costNum : ((p.totalCost == null || p.totalCost === '' || isNaN(+p.totalCost)) ? null : +p.totalCost);
  const totalPriced = priced && totalNum != null;
  const out = {}; PMS.forEach(x => { out[x.c] = { items: [] }; });
  const add = (pm, k, t, law) => out[pm].items.push({ k, t, law });
  const L = (n, l) => (K === 'L' ? l : n);
  const obj = p.object, works = obj === 'works', goods = obj === 'goods';
  const ALL = PMS.map(x => x.c), CONSTR = ['PM1', 'PM2', 'PM3', 'PM4', 'PM5'];

  if (K === 'X') {
    ALL.forEach(pm => add(pm, 'unknown', '민간 발주는 초기 버전의 적용범위 밖입니다. 적용 가능 여부를 직접 확인한 뒤 아래에서 확인 결과를 입력하세요.'));
  } else {
    if (p.agency === 'otherpub' && e.applyRule !== 'confirmed') ALL.forEach(pm => add(pm, 'unknown', '기타 공공기관·지방공기업은 국가·지방계약법령의 준용 근거를 먼저 확인해야 합니다.' + (e.applyRule === 'confirmed' ? '' : ' 2단계에서 준용 근거를 입력하세요.')));
    if (e.exception === 'yes') ALL.forEach(pm => add(pm, 'cond', '특별법·특례(국가유산, 국제입찰, 기관 특례 등)가 적용되는 사업입니다. 해당 규정을 함께 검토하세요.'));
    else if (e.exception !== 'none') ALL.forEach(pm => add(pm, 'unknown', '특별법·특례 적용 여부가 확인되지 않았습니다.'));

    // PM1 적격심사 / PM5 종합심사낙찰제
    if (works) {
      if (!priced) { ['PM1', 'PM5'].forEach(pm => add(pm, 'unknown', costNum == null ? '추정 공사비를 입력해야 금액 기준을 판정할 수 있습니다.' : '입력한 금액이 추정가격 기준으로 확인되지 않았습니다. 금액 기준 판정은 보류합니다.')); }
      else if (K === 'N') {
        if (costNum < 100) { add('PM1', 'ok', '추정가격 100억원 미만 공사는 적격심사 대상입니다.', 'nc42_1'); add('PM5', 'no', '종합심사낙찰제는 추정가격 100억원 이상 공사가 대상입니다.', 'nc42_4'); }
        else {
          add('PM1', 'no', '추정가격 100억원 이상 공사는 종합심사낙찰제 대상입니다.', 'nc42_4'); add('PM5', 'ok', '추정가격 100억원 이상 공사는 종합심사낙찰제 대상입니다.', 'nc42_4');
          if (costNum < 300) { add('PM1', 'info', '100억~300억원 미만 구간을 기술형 적격심사로 전환하는 개정안이 입법예고되었습니다(시행 2027.1. 보도). 2026-10-24 기준 국가법령정보센터 현행본(시행 2026.6.3.)에는 반영되어 있지 않습니다.', 'pre'); add('PM5', 'info', '100억~300억원 미만 구간은 간이형 종합심사낙찰제로 운영되며, 기술형 적격심사 전환이 입법예고되었습니다.', 'pre'); }
        }
      } else {
        if (costNum < 300) { add('PM1', 'ok', '지방계약은 추정가격 300억원 미만 공사에 계약이행능력 심사(적격심사)로 낙찰자를 결정합니다.', 'lc42'); add('PM5', 'no', '지방계약의 종합평가낙찰제는 추정가격 300억원 이상 공사가 대상입니다.', 'lc42_3'); }
        else { add('PM1', 'no', '지방계약에서 추정가격 300억원 이상 공사는 제42조의3(종합평가낙찰제) 대상입니다.', 'lc42'); add('PM5', 'unknown', '지방계약에서 추정가격 300억원 이상 공사는 제42조의3에 따라 지방자치단체에 가장 유리하게 입찰한 자를 낙찰자로 결정합니다(종합평가낙찰제). 국가계약의 종합심사낙찰제(PM5)와 평가체계가 다르므로 설문의 PM5와 대응되는지 확인한 뒤 사용하세요.', 'lc42_3'); }
      }
    } else if (goods) {
      add('PM1', 'cond', '물품 계약의 적격심사 세부기준과 중소기업자간 경쟁 등 계약별 요건을 확인하세요. 공사 금액 기준은 적용하지 않습니다.', L('nc42_1', 'lc42'));
      add('PM5', 'no', '종합심사낙찰제는 공사와 일부 건설기술용역이 대상입니다.', L('nc42_4', 'lc42_3'));
    } else { add('PM1', 'unknown', '계약대상(공사·물품)을 정해야 판정할 수 있습니다.'); add('PM5', 'unknown', '계약대상(공사·물품)을 정해야 판정할 수 있습니다.'); }

    // PM2 턴키 / PM3 대안입찰
    ['PM2', 'PM3'].forEach(pm => {
      const nm = pm === 'PM2' ? '일괄입찰' : '대안입찰', src = L('nc79', 'lc95');
      if (goods) { add(pm, 'no', nm + '은 공사계약의 입찰방법입니다.', src); return; }
      if (obj === 'undecided') { add(pm, 'unknown', '계약대상이 공사로 확정되어야 합니다.'); return; }
      if (hypo && e.hypoTurnkey) { add(pm, 'ok', '가상 시나리오: 모듈러 건축에 일괄·대안입찰을 우선 적용한다고 가정했습니다.', 'bill'); }
      else {
        if (e.newComplex === 'no') { add(pm, 'no', '신규복합공종공사에 해당하지 않아 대형공사·특정공사 경로의 대상 요건을 충족하지 않습니다.', src); return; }
        if (e.newComplex !== 'yes') add(pm, 'unknown', '신규복합공종공사 해당 여부를 확인하세요.', src);
        if (!totalPriced) add(pm, 'unknown', '총공사비 추정가격이 확인되어야 대형공사(300억원 이상)인지 특정공사 경로인지 정할 수 있습니다.', src);
        else if (totalNum < 300) {
          if (e.specific === 'yes') { if ((e.specificMemo || '').trim()) add(pm, 'info', '총공사비 300억원 미만이지만 특정공사로 인정했습니다. 근거: ' + e.specificMemo.trim(), src); else add(pm, 'cond', '특정공사 인정의 근거(판단 문서)를 기록하세요.', src); }
          else add(pm, 'cond', '총공사비 300억원 미만이므로 특정공사로 인정받아야 합니다. ' + (e.specific === 'reviewing' ? '유리성 판단과 근거를 확보하세요.' : '아직 검토하지 않았습니다.'), src);
        } else add(pm, 'info', '총공사비 300억원 이상으로 대형공사 경로입니다.', src);
        if (e.review === 'done') {
          if (e.reviewPM === pm && e.reviewMatch) add(pm, 'ok', '입찰방법 심의에서 ' + nm + '로 결정되었고 사업·금액·범위가 이번 검토와 같습니다.', src);
          else if (e.reviewPM === pm) add(pm, 'cond', '심의 대상 사업·추정가격·공사범위가 이번 검토와 같은지 확인하세요.', src);
          else add(pm, 'cond', '입찰방법 심의 결과가 ' + (e.reviewPM && e.reviewPM !== 'other' ? PMS.find(x => x.c === e.reviewPM).f : '다른 방식') + '로 결정되었습니다. ' + nm + '을 쓰려면 재심의가 필요합니다.', src);
          if (e.notice !== 'done') add(pm, 'info', '심의 결과에 따른 입찰방법 공고를 확인하세요.', src);
        }
        else if (e.review === 'planned') add(pm, 'cond', '입찰방법 심의 결과가 필요합니다(' + (K === 'L' ? '지방' : '중앙') + '건설기술심의위원회).', src);
        else if (e.review === 'no') { add(pm, 'no', '입찰방법 심의를 거치지 않으면 ' + nm + '을 적용할 수 없습니다.', src); return; }
        else add(pm, 'unknown', '입찰방법 심의 대상 여부와 심의 계획을 확인하세요.', src);
      }
      if (pm === 'PM2' && p.stage === 'detail') add(pm, 'cond', '실시설계가 끝난 사업입니다. 설계와 시공을 함께 발주하는 방식과 맞는지 확인하세요.', src);
      if (pm === 'PM3') {
        if (e.altReady === 'yes') add(pm, 'ok', '원안 실시설계와 대안 비교 기준이 준비되어 있습니다.', 'nc84');
        else if (e.altReady === 'preparing') add(pm, 'cond', '원안 실시설계와 대안 허용범위·비교 기준을 준비하세요.', 'nc84');
        else add(pm, 'unknown', '원안 설계와 대안 비교 기준의 준비 여부를 확인하세요.', 'nc84');
        if (p.stage === 'plan') add(pm, 'cond', '대안입찰은 발주자의 원안 설계에 대안을 제시받는 방식입니다. 원안 설계 확보 시점을 확인하세요.', src);
      }
    });

    // PM4 기술제안입찰
    if (goods) add('PM4', 'no', '기술제안입찰은 시설물 공사가 대상입니다.', L('nc97', 'lc126'));
    else if (obj === 'undecided') add('PM4', 'unknown', '계약대상이 공사로 확정되어야 합니다.');
    else {
      const src = L('nc97', 'lc126');
      if (e.facility === 'no') add('PM4', 'no', '상징성·기념성·예술성이 필요하거나 난이도 높은 기술이 필요한 시설물 공사라는 요건에 해당하지 않습니다.', src);
      else if (e.facility === 'yes') { if ((e.facilityMemo || '').trim()) add('PM4', 'ok', '시설물 성격 요건에 해당합니다. 근거: ' + e.facilityMemo.trim(), src); else add('PM4', 'cond', '시설물 성격 요건에 해당한다고 입력했습니다. 인정 근거를 기록하세요.', src); }
      else add('PM4', 'unknown', '상징성·기념성·예술성 또는 고난도 기술이 필요한 시설물인지 확인하세요.', src);
      if (e.facility !== 'no') {
        if (e.review === 'done') { if (e.reviewPM === 'PM4' && e.reviewMatch) add('PM4', 'ok', '입찰방법 심의에서 기술제안입찰로 결정되었습니다.', src); else add('PM4', 'cond', '입찰방법 심의 결과가 기술제안입찰과 다르거나 대상 사업이 다릅니다. 심의 내용을 확인하세요.', src); }
        else if (e.review === 'no' || e.review === 'planned') add('PM4', 'cond', '입찰방법 심의 절차를 확인하세요. 기술제안입찰의 심의 근거 조문은 원문 확인이 필요합니다.', src);
        else add('PM4', 'unknown', '입찰방법 심의 대상 여부와 심의 계획을 확인하세요.', src);
        if (p.stage === 'plan') add('PM4', 'cond', '기본설계 또는 실시설계가 끝난 뒤 적용하는 방식입니다. 설계 일정을 확인하세요.', src);
      }
    }

    // PM6 2단계경쟁입찰
    if (works) add('PM6', 'no', K === 'L' ? '2단계 입찰은 물품의 제조·구매와 용역 계약이 대상이며 공사는 문언에 없습니다.' : '2단계경쟁입찰은 물품의 제조·구매·임차와 용역 계약이 대상이며 공사는 문언에 없습니다.', L('nc18', 'lc18'));
    else if (goods) add('PM6', 'ok', K === 'L' ? '물품의 제조·구매 계약에서 규격·기술입찰 후 가격입찰을 실시할 수 있습니다. 지방계약 문언에는 임차가 없습니다.' : '물품 계약에서 규격·기술입찰 후 가격입찰을 실시할 수 있습니다.', L('nc18', 'lc18'));
    else add('PM6', 'unknown', '물품·용역 계약에 적용하는 방식입니다. 계약대상을 정하세요.', L('nc18', 'lc18'));

    if (!pdfFontsReady(d0.need) && document.fonts && document.fonts.load) { stage = '글꼴 로딩'; await Promise.race([Promise.all(Object.keys(d0.need).map(f => document.fonts.load(f, d0.need[f]).catch(() => null))), new Promise(r => setTimeout(r, 1500))]); }
    stage = '그리기'; const d = new PdfDoc(false); drawSummary(d);
    stage = '이미지 변환'; const imgs = d.pages.map(c => ({ w: c.width, h: c.height, data: dataUrlBytes(c.toDataURL('image/jpeg', 0.9)) }));
    stage = '파일 조립'; const pdf = buildPdf(imgs);
    stage = '저장'; await saveFile(fileBase() + '_의사결정요약.pdf', pdf);
  } catch (e) { toast('요약 PDF를 만들지 못했습니다(' + stage + ' 단계: ' + ((e && (e.code || e.message)) || e) + '). 이 문구를 알려 주시면 원인을 찾겠습니다.', 12000); if (window.console) console.error(e); }
}

/* ───────── 이벤트와 시작 ───────── */
function go(step) { S.step = step; renderAll(); window.scrollTo({ top: 0, behavior: 'auto' }); }
const ACT = {
  step: t => go(+t.dataset.step),
  confirm: () => { S.confirmed = true; S.tab = 'sum'; go(4); },
  tab: t => { S.tab = t.dataset.tab; renderAll(); },
  new: () => { const start = () => { S = blank(); renderAll(); window.scrollTo(0, 0); toast('새 사업을 시작했습니다.'); }; if (S.example || !(S.project.name || S.project.cost !== '')) start(); else confirmBox('현재 입력을 지우고 새 사업을 시작할까요? 필요하면 먼저 저장파일로 저장하세요.', '새 사업 시작', start); },
  example: () => { S = exampleState(); renderAll(); window.scrollTo(0, 0); },
  load: () => $('#file').click(),
  save: () => exportJson(),
  'goto-pm': t => { if (S.step !== 2) { S.step = 2; renderAll(); } const e = document.getElementById('pm-' + t.dataset.pm); if (e) e.scrollIntoView({ block: 'center' }); },
  'cond-all': t => { D.factors.forEach(f => { if (f.code === 'F05') return; S.cond[f.code] = Object.assign({ memo: '' }, S.cond[f.code], { s: t.dataset.v }); }); renderAll(); },
  'reset-expert': () => { S.expert = { mult: {}, lamMode: 'model', lam: '', includeCaution: false }; renderAll(); },
  'scn-add': () => { const n = $('#scn-name').value.trim(), r = $('#scn-reason').value.trim(); if (!n) { toast('시나리오 이름을 입력하세요.'); $('#scn-name').focus(); return; } S.scenarios.push({ id: 's' + Date.now().toString(36), name: n, reason: r, at: new Date().toISOString(), snap: snapNow() }); renderAll(); toast("'" + n + "' 시나리오를 저장했습니다."); },
  'scn-load': t => { const sc = S.scenarios.find(x => x.id === t.dataset.id); if (!sc) return; const sn = JSON.parse(JSON.stringify(sc.snap)); S.project.cost = sn.cost; S.cond = sn.cond; S.expert = sn.expert; renderAll(); toast("'" + sc.name + "' 시나리오의 조건을 불러왔습니다."); },
  'scn-del': t => { S.scenarios = S.scenarios.filter(x => x.id !== t.dataset.id); renderAll(); },
  'out-pdf': () => exportPdf(), 'out-report': () => exportReport(), 'out-xlsx': () => exportXlsx(), 'out-json': () => exportJson(),
  help: t => helpModal(t.dataset.topic),
  'modal-close': () => { $('#modal').hidden = true; $('#modal').innerHTML = ''; },
  'modal-yes': () => { const fn = confirmBox.fn; ACT['modal-close'](); if (fn) fn(); },
  'modal-copy': async () => { const ta = $('#modal-text'); try { await navigator.clipboard.writeText(ta.value); toast('복사했습니다.'); } catch (e) { ta.focus(); ta.select(); toast('자동 복사가 막혀 있습니다. 선택된 내용을 직접 복사하세요.'); } }
};
const LAW_WIN = 'width=1060,height=840,left=120,top=60,resizable=yes,scrollbars=yes,toolbar=no,menubar=no,location=yes';
function openLaw(href) { try { const w = window.open(href, 'lawwin', LAW_WIN); if (w) { try { w.focus(); } catch (x) { /* 무시 */ } return true; } } catch (x) { /* 팝업 차단 등 */ } return false; }
document.addEventListener('click', e => { const a = e.target.closest('a.lawpop'); if (a && openLaw(a.href)) e.preventDefault(); });
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t) return; const fn = ACT[t.dataset.act]; if (fn) { e.preventDefault(); fn(t); } });
function applyInput(t) {
  if (t.dataset.lam) { const v = parseFloat(t.value); S.expert.lam = isNaN(v) ? '' : Math.min(100, Math.max(0, v)) / 100; return true; }
  if (t.dataset.pair) { const p = pairOf(CALC.R) || { a: null, b: null }; S.pair = { a: p.a, b: p.b }; S.pair[t.dataset.pair] = +t.value; return true; }
  if (t.dataset.arr) { const arr = getPath(t.dataset.arr).filter(v => v !== t.value); if (t.checked) arr.push(t.value); setPath(t.dataset.arr, arr); return true; }
  if (!t.dataset.path) return false;
  let v = t.type === 'checkbox' ? t.checked : t.value;
  if (t.type === 'number') v = t.value === '' ? '' : Math.max(0, +t.value);
  if (/^expert\.mult\./.test(t.dataset.path)) v = +v;
  if (t.type === 'radio' && !t.checked) return false;
  setPath(t.dataset.path, v); if (t.dataset.path === 'project.name') S.example = false; return true;
}
document.addEventListener('input', e => { const t = e.target; if (!t.matches || !t.matches('input[type=text],input[type=number],input[type=date],input[type=month],textarea')) return; if (applyInput(t)) { calc(); renderNav(); renderSide(); saveLocal(); } });
/* 글자·숫자 입력창의 change(blur)는 300ms 뒤에 다시 그린다. 입력창을 떠나며 누른 선택지의 클릭(mousedown~mouseup)이 화면 재생성에 밀려 사라지지 않게 하기 위함. 값 자체는 input 이벤트에서 이미 반영된다. */
const TEXTY = 'input[type=text],input[type=number],input[type=date],input[type=month],textarea';
let rTimer = null;
function renderSoon() { clearTimeout(rTimer); rTimer = setTimeout(() => { rTimer = null; const a = document.activeElement; if (a && a.matches && a.matches(TEXTY)) { renderSoon(); return; } renderAll(true); }, 300); }
document.addEventListener('change', e => { const t = e.target; if (t.id === 'file') { const f = t.files && t.files[0]; if (f) { const r = new FileReader(); r.onload = () => importJson(String(r.result)); r.onerror = () => toast('파일을 읽지 못했습니다.'); r.readAsText(f); } t.value = ''; return; } if (applyInput(t)) { if (t.matches && t.matches(TEXTY)) renderSoon(); else { clearTimeout(rTimer); rTimer = null; renderAll(true); } } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) ACT['modal-close'](); });
/* 툴팁 */
(function () { const tip = $('#tip'); let cur = null;
  const show = (el, x, y) => { cur = el; tip.textContent = el.dataset.tip; tip.hidden = false; const r = tip.getBoundingClientRect(), vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight; let l = x + 14, t = y + 16; if (l + r.width > vw - 8) l = Math.max(8, vw - r.width - 8); if (t + r.height > vh - 8) t = Math.max(8, y - r.height - 12); tip.style.left = l + 'px'; tip.style.top = t + 'px'; };
  const hide = () => { cur = null; tip.hidden = true; };
  document.addEventListener('mousemove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) show(el, e.clientX, e.clientY); else if (cur) hide(); });
  document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); show(el, r.left + 20, r.bottom - 8); } });
  document.addEventListener('focusout', hide); document.addEventListener('scroll', hide, true);
})();
/* 시작 */
initEngine(JSON.parse(document.getElementById('dss-data').textContent));
S = loadLocal() || exampleState();
renderAll();
dlPromise = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
setTimeout(pdfWarmFonts, 800);
if (window.claude && window.claude.hot && window.claude.hot.snapshot) { try { window.claude.hot.snapshot(() => ({ state: S })); } catch (e) { /* 선택 기능 */ } }

</script>
