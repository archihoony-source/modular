{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow-sm border border-gray-200 p-8">
    <h2 class="text-xl font-bold mb-6">관리자 로그인</h2>

    {% if error %}
    <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded text-sm">
        {{ error }}
    </div>
    {% endif %}

    <form action="/admin/login" method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
            <input type="password" name="password" required autofocus
                   class="w-full px-3 py-2 border border-gray-300 rounded-md
                          focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button type="submit"
                class="w-full px-4 py-2 bg-blue-600 text-white font-medium rounded-md
                       hover:bg-blue-700 transition-colors">
            로그인
        </button>
    </form>
</div>
{% endblock %}
