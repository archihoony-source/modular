# Render Blueprint
# 이 파일을 GitHub 레포 루트에 두면 Render가 자동 감지하여
# Dashboard에서 "New Blueprint Instance" 클릭만으로 배포 가능.

services:
  - type: web
    name: modular-survey
    runtime: python
    plan: free
    region: singapore                  # 한국에서 가장 가까운 무료 리전
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_URL
        sync: false                    # 배포 시 Render Dashboard에서 직접 입력 (Supabase URL)
      - key: ADMIN_PASSWORD
        sync: false                    # 배포 시 직접 입력
      - key: SURVEY_TITLE
        value: "차세대 모듈러 건축 핵심기술 수요조사"
      - key: SURVEY_DEADLINE
        sync: false                    # 예: 2026-06-30
      - key: SESSION_SECRET
        generateValue: true            # Render가 자동 생성
